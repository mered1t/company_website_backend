name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_pass
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_user -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql+asyncpg://crm_user:crm_pass@localhost:5432/crm_test
      RESEND_API_KEY: re_ci_dummy
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create runtime directories
        run: mkdir -p media static

      - name: Tests
        run: pytest -v

      - name: Migrations apply on a fresh database and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://crm_user:crm_pass@localhost:5432/crm_migrations
        run: |
          PGPASSWORD=crm_pass psql -h localhost -U crm_user -d crm_test -c "CREATE DATABASE crm_migrations"
          alembic upgrade head
          alembic check

      - name: Lint (pyflakes rules, advisory for now)
        continue-on-error: true
        run: ruff check . --select F --exclude alembic --exclude models/__init__.py
