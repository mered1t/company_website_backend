{% extends "base_email.html" %}

{% block content %}
<h2 style="color:#111827; margin-top:0;">Приглашение в команду</h2>
<p style="color:#374151; font-size:14px; line-height:1.6;">
  Вас пригласили присоединиться к <b>{{ organization_name }}</b> на платформе {{ app_name }}.
</p>
<table cellpadding="0" cellspacing="0" style="margin: 24px 0;">
  <tr>
    <td style="background-color:#111827; border-radius:6px;">
      <a href="{{ accept_url }}" style="display:inline-block; padding:12px 24px; color:#ffffff; text-decoration:none; font-size:14px;">
        Принять приглашение
      </a>
    </td>
  </tr>
</table>
<p style="color:#9ca3af; font-size:12px;">
  Ссылка действительна 7 дней. Если вы не ожидали это письмо — просто проигнорируйте его.
</p>
{% endblock %}
