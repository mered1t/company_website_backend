{% extends "base_email.html" %}

{% block content %}
<h2 style="color:#111827; margin-top:0;">{{ t.heading }}</h2>
<p style="color:#374151; font-size:14px; line-height:1.6;">
  {{ t.body }}
</p>
<table width="100%" cellpadding="0" cellspacing="0" style="margin: 16px 0; font-size:14px; color:#374151;">
  <tr>
    <td style="padding:8px 0; {% if days_left is not none %}border-bottom:1px solid #e5e7eb; {% endif %}color:#6b7280;">{{ t.label_date }}</td>
    <td style="padding:8px 0; {% if days_left is not none %}border-bottom:1px solid #e5e7eb; {% endif %}text-align:right;"><b>{{ date_text }}</b></td>
  </tr>
  {% if days_left is not none %}
  <tr>
    <td style="padding:8px 0; color:#6b7280;">{{ t.label_days }}</td>
    <td style="padding:8px 0; text-align:right;"><b>{{ days_left }}</b></td>
  </tr>
  {% endif %}
</table>
<table cellpadding="0" cellspacing="0" style="margin: 24px 0;">
  <tr>
    <td style="background-color:#111827; border-radius:6px;">
      <a href="{{ open_url }}" style="display:inline-block; padding:12px 24px; color:#ffffff; text-decoration:none; font-size:14px;">
        {{ t.button }}
      </a>
    </td>
  </tr>
</table>
<p style="color:#6b7280; font-size:13px; line-height:1.6;">
  {{ t.footer }}
</p>
{% endblock %}
