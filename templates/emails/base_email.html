<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>{{ app_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#0A0B10; }
  a { color:#B3A9FF; }
  @media (max-width: 620px) {
    .outer { padding:16px 8px !important; }
    .pad { padding-left:20px !important; padding-right:20px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background:#0A0B10;">
{%- block preheader %}{% endblock %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0A0B10" style="background:#0A0B10;">
<tr><td class="outer" align="center" style="padding:40px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px;">
<tr><td bgcolor="#13141D" style="background:#13141D; border:1px solid #22242F; border-radius:20px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
{%- block header %}{% import "_ui.html" as ui %}
<tr><td style="padding:20px 32px; border-bottom:1px solid #1F2130;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td width="36" height="36" align="center" valign="middle" bgcolor="#6A5AF0" style="width:36px; height:36px; background:#6A5AF0; border-radius:10px; font-family:{{ ui.FONT }}; font-size:16px; font-weight:700; color:#FFFFFF;">{{ app_name[:1]|upper }}</td>
<td valign="middle" style="padding-left:12px; font-family:{{ ui.FONT }}; font-size:16px; font-weight:600; color:#ECEDF5;">{{ app_name }}</td>
</tr></table>
</td></tr>
{%- endblock %}
<tr><td class="pad" style="padding:36px 32px 32px;">
{% block content %}{% endblock %}
</td></tr>
</table>
</td></tr>
<tr><td align="center" style="padding:24px 12px 0;">
{%- block footer %}{% import "_ui.html" as ui %}
<p style="margin:0; font-family:{{ ui.FONT }}; font-size:12px; color:#5F6279;">&copy; {{ current_year }} {{ app_name }}</p>
{%- endblock %}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
