{% extends "base_email.html" %}

{% block content %}
<h2 style="color:#111827; margin-top:0;">Сброс пароля</h2>
<p style="color:#374151; font-size:14px; line-height:1.6;">
  Вы запросили сброс пароля для вашего аккаунта.
</p>
<table cellpadding="0" cellspacing="0" style="margin: 24px 0;">
  <tr>
    <td style="background-color:#111827; border-radius:6px;">
      <a href="{{ reset_url }}" style="display:inline-block; padding:12px 24px; color:#ffffff; text-decoration:none; font-size:14px;">
        Задать новый пароль
      </a>
    </td>
  </tr>
</table>
<p style="color:#9ca3af; font-size:12px;">
  Ссылка действительна 30 минут. Если вы не запрашивали сброс — просто проигнорируйте это письмо, пароль останется прежним.
</p>
{% endblock %}
