{% extends "base_email.html" %}

{% block content %}
<h2 style="color:#111827; margin-top:0;">Подтвердите ваш email</h2>
<p style="color:#374151; font-size:14px; line-height:1.6;">
  Здравствуйте! Осталось подтвердить email, чтобы пользоваться всеми функциями.
</p>
<table cellpadding="0" cellspacing="0" style="margin: 24px 0;">
  <tr>
    <td style="background-color:#111827; border-radius:6px;">
      <a href="{{ verify_link }}" style="display:inline-block; padding:12px 24px; color:#ffffff; text-decoration:none; font-size:14px;">
        Подтвердить email
      </a>
    </td>
  </tr>
</table>
<p style="color:#9ca3af; font-size:12px;">
  Если кнопка не работает, скопируйте ссылку: {{ verify_link }}
</p>
{% endblock %}
